<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slideshow — International Airport Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0c0c0c;
    --rule: #282828;
    --dim: #555;
    --mid: #888;
    --bright: #c8c8c8;
    --white: #efefef;
    --mono: 'IBM Plex Mono', monospace;
    --cond: 'IBM Plex Sans Condensed', sans-serif;
    --panel-w: 30%;
  }
  html, body {
    width: 100%; height: 100%;
    background: var(--black);
    color: var(--white);
    overflow: hidden;
  }
  #wrapper {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    width: 100vw;
  }

  /* ── HEADER (identical to index) ── */
  #header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    padding: 14px 24px 14px;
    border-bottom: 1px solid var(--rule);
  }
  #title-label {
    font-family: var(--mono);
    font-size: clamp(10px, 1vw, 13px);
    font-weight: 300;
    letter-spacing: 0.08em;
    line-height: 1.05;
    color: var(--mid);
    text-transform: uppercase;
  }
  #title-main {
    font-family: var(--mono);
    font-size: clamp(14px, 1.6vw, 22px);
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--white);
    margin-top: 3px;
  }
  #stats-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
  }
  .stat-row {
    display: grid;
    grid-template-columns: 72px auto;
    align-items: baseline;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 300;
  }
  .stat-label { color: var(--dim); }
  .stat-value { color: var(--bright); }

  /* ── MAIN AREA ── */
  #main {
    position: relative;
    overflow: hidden;
    display: flex;
  }

  /* ── CANVAS ── */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #bg-grid {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 28px);
  }
  #graph-canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 1; }

  /* progress bar at top of canvas */
  #progress-bar {
    position: absolute;
    top: 0; left: 0;
    height: 1px;
    background: var(--bright);
    width: 0%;
    transition: none;
    opacity: 0.5;
  }

  /* current node label bottom-left */
  #node-label {
    position: absolute;
    bottom: 22px;
    left: 24px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #node-label.visible { opacity: 1; }
  #nl-iata {
    font-family: var(--mono);
    font-size: clamp(32px, 4vw, 56px);
    font-weight: 500;
    color: var(--white);
    letter-spacing: 0.06em;
    line-height: 1;
  }


  /* slide counter bottom-right of canvas */
  #counter {
    position: absolute;
    bottom: 22px;
    right: 24px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    pointer-events: none;
  }

  /* ── RIGHT PANEL ── */
  #panel {
    width: var(--panel-w);
    min-width: 260px;
    border-left: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    background: var(--black);
    overflow-y: auto;
    overflow-x: hidden;
  }
  #panel.open { transform: translateX(0); }

  /* image area — fixed 1:1 ratio based on panel width */
  #panel-img-wrap {
    flex-shrink: 0;
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-bottom: 1px solid var(--rule);
    background: #0a0a0a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #panel-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.5s ease 0.3s;
    display: block;
  }
  #panel-img.loaded { opacity: 1; }
  #panel-img-placeholder {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    text-align: center;
    display: none;
    position: absolute;
  }

  /* info area */
  #panel-info {
    padding: 20px 24px;
    flex-shrink: 0;
  }
  #pi-name {
    font-family: var(--cond);
    font-size: 17px;
    font-weight: 400;
    color: var(--white);
    line-height: 1.3;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }
  .pi-row {
    display: grid;
    grid-template-columns: 130px 1fr;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.9;
    letter-spacing: 0.05em;
  }
  .pi-key { color: var(--dim); text-transform: uppercase; }
  .pi-val { color: var(--mid); }

  #pi-coords { margin-top: 0; }

  /* ── FOOTER ── */
  #footer {
    border-top: 1px solid var(--rule);
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    height: 48px;
    flex-shrink: 0;
  }
  .nav-btn {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.14em;
    color: var(--mid);
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, background 0.15s;
  }
  .nav-btn:hover { color: var(--white); background: rgba(255,255,255,0.04); }
  button.nav-btn {
    background: none;
    border: none;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  button.nav-btn.playing { color: var(--bright); }
  .nav-divider { background: var(--rule); }
</style>
</head>

  <header id="header">
    <div>
      <div id="title-label">Networked Non-Places</div>
      <div id="title-main">International Airport Archive</div>

    <div id="stats-block">

  <div id="main">

      <div id="node-label">
        <div id="nl-iata"></div>

      <div id="counter" style="display:none"></div>

    </div>

    <div id="panel">

        <div id="panel-img-placeholder">No image available</div>
      </div>
      <div id="panel-info">

        <div class="pi-row"><span class="pi-key">City</span><span class="pi-val" id="pi-city"></span></div>
        <div class="pi-row"><span class="pi-key">Country</span><span class="pi-val" id="pi-country"></span></div>
        <div class="pi-row"><span class="pi-key">ICAO</span><span class="pi-val" id="pi-icao"></span></div>
        <div class="pi-row"><span class="pi-key">Routes</span><span class="pi-val" id="pi-deg"></span></div>
        <div style="border-top:1px solid var(--rule);margin:10px 0 4px"></div>
        <div id="pi-coords"></div>
      </div>
    </div>
  </div>

  <footer id="footer">
    <a href="../index.html" class="nav-btn">← Network</a>
    <div class="nav-divider"></div>
    <button id="traverse-btn" class="nav-btn" onclick="toggleTraverse()">Traverse</button>
  </footer>

</div>

// ── SETUP ──
const canvas  = document.getElementById('graph-canvas');
const ctx     = canvas.getContext('2d');
const wrap    = document.getElementById('canvas-wrap');
const panel   = document.getElementById('panel');
const progBar = document.getElementById('progress-bar');

let W, H, dpr;
let tx = 0, ty = 0, scale = 1;
// Camera target for smooth animation
let targetTx = 0, targetTy = 0, targetScale = 1;

// GEXF → world coords
const GX_MIN = Math.min(...GRAPH.nodes.map(n=>n.x));
const GX_MAX = Math.max(...GRAPH.nodes.map(n=>n.x));
const GY_MIN = Math.min(...GRAPH.nodes.map(n=>n.y));
const GY_MAX = Math.max(...GRAPH.nodes.map(n=>n.y));
const WORLD = 1000;

function gexfToWorld(gx, gy) {
  return {
    wx: (gx - GX_MIN) / (GX_MAX - GX_MIN) * WORLD,
    wy: (GY_MAX - gy) / (GY_MAX - GY_MIN) * WORLD
  };
}

function nodeRadius(deg) {
  if (deg <= 0) return 1.2;
  const t = Math.min(Math.log1p(deg) / Math.log1p(400), 1);
  const t2 = Math.pow(t, 3.2);
  return 1.2 + t2 * 6.5;
}

const nodes = GRAPH.nodes.map(d => {
  const {wx, wy} = gexfToWorld(d.x, d.y);
  return { ...d, wx, wy, ox: 0, oy: 0 };
});
const nodeById = {};
nodes.forEach(n => nodeById[n.id] = n);
const adj = GRAPH.adj;

// Float animation
const phases = nodes.map(() => ({
  px: Math.random() * Math.PI * 2,
  py: Math.random() * Math.PI * 2,
  fx: 0.4 + Math.random() * 0.7,
  fy: 0.4 + Math.random() * 0.7,
}));
let animT = 0;

function updateFloat() {
  animT += 0.0004;
  nodes.forEach((n, i) => {
    const p = phases[i];
    n.ox = Math.sin(animT * p.fx + p.px) * 1.8;
    n.oy = Math.cos(animT * p.fy + p.py) * 1.8;
  });
}

function worldToScreen(wx, wy) {
  return { sx: wx * scale + tx, sy: wy * scale + ty };
}
function inView(wx, wy, r) {
  const {sx, sy} = worldToScreen(wx, wy);
  const rs = r * scale + 2;
  return sx + rs > 0 && sx - rs < W && sy + rs > 0 && sy - rs < H;
}

// ── SLIDESHOW STATE ──
let csvData = {};       // iata → row
let slideNodes = [];    // nodes sorted by degree, filtered to those with CSV data
let currentIdx = 0;
let activeNode = null;
let activeNeighbors = new Set();
let slideTimer = null;
let progressStart = 0;
const SLIDE_DURATION = 5000; // ms per slide

// ── DRAW ──
function draw() {
  ctx.clearRect(0, 0, W, H);
  const hov = activeNode;

  // Draw edges
  if (hov) {
    const nbs = adj[hov.id] || [];
    const {sx: hx, sy: hy} = worldToScreen(hov.wx + hov.ox, hov.wy + hov.oy);
    nbs.forEach(nid => {
      const nb = nodeById[nid];
      if (!nb) return;
      const {sx: bx, sy: by} = worldToScreen(nb.wx + nb.ox, nb.wy + nb.oy);
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(bx, by);
      ctx.strokeStyle = 'rgba(160,160,160,0.18)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    });
  }

  const sorted = [...nodes].sort((a, b) => a.deg - b.deg);
  sorted.forEach(n => {
    const wx = n.wx + n.ox, wy = n.wy + n.oy;
    const baseR = nodeRadius(n.deg);
    if (!inView(wx, wy, baseR + 2)) return;
    const {sx, sy} = worldToScreen(wx, wy);
    const r = Math.max(baseR * scale, 0.6);

    const isActive = hov && n === hov;
    const isNb = hov && activeNeighbors.has(n.id);
    let fill;
    if (!hov) {
      const t = Math.min(Math.log1p(n.deg) / Math.log1p(400), 1);
      const t2 = Math.pow(t, 3.6);
      const b = Math.round(30 + t * 90 + t2 * 135);
      const a = 0.10 + t * 0.20 + t2 * 0.70;
      fill = `rgba(${b},${b},${b},${a})`;
    } else {
      if (isActive)     fill = 'rgba(255,255,255,1)';
      else if (isNb)    fill = 'rgba(160,160,160,0.75)';
      else {
        const t = Math.min(Math.log1p(n.deg) / Math.log1p(400), 1);
        const b = Math.round(25 + t * 60);
        fill = `rgba(${b},${b},${b},0.18)`;
      }
    }

    ctx.beginPath();
    ctx.arc(sx, sy, isActive ? Math.max(r, 3 * scale) : r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();

    // pulse ring on active node
    if (n === hov) {
      const pulse = Math.sin(animT * 3) * 0.5 + 0.5;
      ctx.beginPath();
      ctx.arc(sx, sy, Math.max(r, 3 * scale) + 3 + pulse * 3, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${0.08 + pulse * 0.08})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  });
}

// ── CAMERA ──
function smoothCamera() {
  const ease = 0.06;
  tx += (targetTx - tx) * ease;
  ty += (targetTy - ty) * ease;
  scale += (targetScale - scale) * ease;
}

function focusNode(n) {
  // Zoom just enough to see the node and its neighbourhood
  // Use the bounding box of all neighbours to determine scale
  const canvasW = wrap.getBoundingClientRect().width || W;
  const nbs = (adj[n.id] || []).map(id => nodeById[id]).filter(Boolean);
  
  let minX = n.wx, maxX = n.wx, minY = n.wy, maxY = n.wy;
  nbs.forEach(nb => {
    minX = Math.min(minX, nb.wx);
    maxX = Math.max(maxX, nb.wx);
    minY = Math.min(minY, nb.wy);
    maxY = Math.max(maxY, nb.wy);
  });

  const pad = 80;
  const rangeX = (maxX - minX) || 60;
  const rangeY = (maxY - minY) || 60;
  const scaleX = (canvasW - pad * 2) / rangeX;
  const scaleY = (H - pad * 2) / rangeY;
  // Cap zoom: never closer than 1.2x the fit-view, never further than 4x
  const fitScale = Math.min((canvasW - 96) / WORLD, (H - 96) / WORLD);
  targetScale = Math.min(Math.max(Math.min(scaleX, scaleY), fitScale * 1.2), fitScale * 4);

  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  targetTx = canvasW / 2 - cx * targetScale;
  targetTy = H / 2 - cy * targetScale;
}

// ── PROGRESS BAR ──
function tickProgress() {
  const elapsed = performance.now() - progressStart;
  const pct = Math.min(elapsed / SLIDE_DURATION * 100, 100);
  progBar.style.width = pct + '%';
}

// ── ADVANCE SLIDE ──
function showSlide(idx) {
  currentIdx = idx;
  const n = slideNodes[idx];
  if (!n) return;

  activeNode = n;
  activeNeighbors = new Set(adj[n.id] || []);
  focusNode(n);

  // Update bottom-left label
  const label = document.getElementById('node-label');
  label.classList.remove('visible');
  setTimeout(() => {
    document.getElementById('nl-iata').textContent = n.id;
    label.classList.add('visible');
  }, 200);

  // Counter
  document.getElementById('counter').textContent =
    (idx + 1).toString().padStart(2,'0') + ' / ' + slideNodes.length.toString().padStart(2,'0');

  // Panel
  updatePanel(n);

  // Progress bar reset
  progressStart = performance.now();
  progBar.style.transition = 'none';
  progBar.style.width = '0%';
  setTimeout(() => {
    progBar.style.transition = `width ${SLIDE_DURATION}ms linear`;
    progBar.style.width = '100%';
  }, 30);

  // Schedule next
  clearTimeout(slideTimer);
  if (isPlaying) {
    slideTimer = setTimeout(() => {
      showSlide((idx + 1) % slideNodes.length);
    }, SLIDE_DURATION);
  }
}

function updatePanel(n) {
  const csv = csvData[n.id] || {};
  panel.classList.add('open');

  document.getElementById('pi-name').textContent = n.name;
  document.getElementById('pi-city').textContent = n.city || csv.city || '—';
  document.getElementById('pi-country').textContent = n.country || csv.countryLabel || '—';
  document.getElementById('pi-icao').textContent = n.icao || csv.icao || '—';
  document.getElementById('pi-deg').textContent = n.deg;

  const lat = csv.lat || n.lat || '';
  const lon = csv.lon || n.lon || '';
  const coordsEl = document.getElementById('pi-coords');
  if (lat && lon) {
    const latF = parseFloat(lat), lonF = parseFloat(lon);
    const latDir = latF >= 0 ? 'N' : 'S';
    const lonDir = lonF >= 0 ? 'E' : 'W';
    coordsEl.innerHTML =
      `<div class="pi-row"><span class="pi-key">Lat</span><span class="pi-val">${Math.abs(latF).toFixed(5)}° ${latDir}</span></div>` +
      `<div class="pi-row"><span class="pi-key">Lon</span><span class="pi-val">${Math.abs(lonF).toFixed(5)}° ${lonDir}</span></div>`;
  } else {
    coordsEl.innerHTML = '';
  }

  // Image
  const img = document.getElementById('panel-img');
  const placeholder = document.getElementById('panel-img-placeholder');
  img.classList.remove('loaded');
  img.style.display = 'block';
  placeholder.style.display = 'none';

  if (csv.filename) {
    img.onload = () => img.classList.add('loaded');
    img.onerror = () => {
      img.style.display = 'none';
      placeholder.style.display = 'block';
      placeholder.textContent = 'No image available';
    };
    img.src = '../table/airport_vector/' + csv.filename;
  } else {
    img.style.display = 'none';
    placeholder.style.display = 'block';
    placeholder.textContent = 'No image available';
  }
}

// ── CSV PARSING ──
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
  const rows = {};
  for (let i = 1; i < lines.length; i++) {
    const vals = lines[i].match(/(".*?"|[^,]+|(?<=,)(?=,)|^(?=,)|(?<=,)$)/g) || [];
    const row = {};
    headers.forEach((h, j) => {
      row[h] = (vals[j] || '').replace(/^"|"$/g,'').trim();
    });
    // Key by iata
    if (row.iata) rows[row.iata] = row;
  }
  return rows;
}

// ── RESIZE ──
function fitView() {
  const pad = 48;
  const cw = wrap.getBoundingClientRect().width || W;
  const s = Math.min((cw - pad*2) / WORLD, (H - pad*2) / WORLD);
  scale = s; targetScale = s;
  tx = (cw - WORLD * s) / 2; targetTx = tx;
  ty = (H - WORLD * s) / 2;  targetTy = ty;
}

function resize() {
  const rect = wrap.getBoundingClientRect();
  W = rect.width; H = rect.height;
  dpr = window.devicePixelRatio || 1;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
}

// ── MAIN LOOP ──
function loop() {
  updateFloat();
  smoothCamera();
  draw();
  requestAnimationFrame(loop);
}

// ── INIT ──
async function init() {
  // Wait one frame for flex layout to settle before measuring
  await new Promise(r => requestAnimationFrame(r));
  resize();

  // Fit view first (before panel opens)
  const pad = 48;
  const s = Math.min((W - pad*2) / WORLD, (H - pad*2) / WORLD);
  scale = s; targetScale = s;
  tx = (W - WORLD * s) / 2; targetTx = tx;
  ty = (H - WORLD * s) / 2; targetTy = ty;

  loop();

  // Load CSV (requires local server; gracefully skips if on file://)
  try {
    const res = await fetch('../table/airport_large.csv');
    if (res.ok) {
      const text = await res.text();
      csvData = parseCSV(text);
    }
  } catch(e) {
    // file:// protocol or missing file — continue without images
  }

  // Build slide order: sort by degree desc, take nodes that appear in CSV
  slideNodes = [...nodes]
    .filter(n => n.deg > 0)
    .sort((a, b) => b.deg - a.deg);

  // Start slideshow — or pin to a specific airport via ?iata=XXX
  const urlIata = new URLSearchParams(window.location.search).get('iata');
  if (urlIata) {
    const target = nodes.find(n => n.id === urlIata.toUpperCase());
    if (target) {
      activeNode = target;
      activeNeighbors = new Set(adj[target.id] || []);
      focusNode(target);
      progBar.style.display = 'none';
      currentIdx = Math.max(slideNodes.findIndex(n => n.id === target.id), 0);
      setTimeout(() => {
        document.getElementById('nl-iata').textContent = target.id;
        document.getElementById('node-label').classList.add('visible');
        document.getElementById('counter').textContent = target.id;
        updatePanel(target);
      }, 400);
      return; // don't start auto-advance
    }
  }

  // Start slideshow after brief delay
  setTimeout(() => {
    isPlaying = true;
    const btn = document.getElementById('traverse-btn');
    btn.classList.add('playing');
    btn.textContent = 'Pause';
    progBar.style.display = '';
    showSlide(0);
  }, 800);
}

// ── TRAVERSE PLAY / PAUSE ──
let isPlaying = false;

function toggleTraverse() {
  const btn = document.getElementById('traverse-btn');
  if (isPlaying) {
    // Pause
    clearTimeout(slideTimer);
    slideTimer = null;
    progBar.style.transition = 'none';
    progBar.style.width = '0%';
    progBar.style.display = 'none';
    isPlaying = false;
    btn.classList.remove('playing');
    btn.textContent = 'Traverse';
  } else {
    // Play
    progBar.style.display = '';
    isPlaying = true;
    btn.classList.add('playing');
    btn.textContent = 'Pause';
    showSlide(currentIdx >= 0 ? currentIdx % slideNodes.length : 0);
  }
}

window.addEventListener('resize', () => {
  resize();
  if (activeNode) focusNode(activeNode);
});

init();
</script>
